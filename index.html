<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Bhoomi</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
}

/* Typing Text */
h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 80px;
    color: gold;
    text-align: center;
    border-right: 3px solid white;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    animation: typing 4s steps(25, end) forwards, blink 0.7s infinite;
}

/* Typing animation */
@keyframes typing {
    from { width: 0 }
    to { width: 100% }
}

/* Cursor blinking */
@keyframes blink {
    50% { border-color: transparent }
}

/* Firecracker spark */
.spark {
    position: absolute;
    width: 5px;
    height: 5px;
    background: yellow;
    border-radius: 50%;
    animation: explode 1s ease-out forwards;
}

@keyframes explode {
    from {
        transform: translate(0,0);
        opacity: 1;
    }
    to {
        transform: translate(var(--x), var(--y));
        opacity: 0;
    }
}
</style>
</head>

<body>

<h1 id="text"></h1>

<!-- 🎶 Background Music -->
<audio id="music" loop>
    <source src="birthday.mp3" type="audio/mpeg">
</audio>

<script>
/* Typing Effect */
const message = "Happy Birthday Bhoomi 🎂";
let i = 0;
const speed = 100;

function typeWriter() {
    if (i < message.length) {
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
    }
}
typeWriter();

/* Play music on click (browser restriction fix) */
window.addEventListener("click", () => {
    document.getElementById("music").play();
});

/* Firecracker function */
function createCracker(xPos) {
    const yPos = Math.random() * window.innerHeight;

    for (let i = 0; i < 25; i++) {
        let spark = document.createElement("div");
        spark.className = "spark";

        spark.style.left = xPos + "px";
        spark.style.top = yPos + "px";

        spark.style.setProperty('--x', (Math.random() * 200 - 100) + "px");
        spark.style.setProperty('--y', (Math.random() * 200 - 100) + "px");

        document.body.appendChild(spark);

        setTimeout(() => spark.remove(), 1000);
    }
}

/* Crackers both sides */
setInterval(() => createCracker(50), 1200);
setInterval(() => createCracker(window.innerWidth - 50), 1400);
</script>

</body>
</html>
